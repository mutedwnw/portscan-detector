[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscan-detector"
version = "0.1.0"
description = "Educational TCP port scan detection in CSV and PCAP logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
pcap = ["scapy>=2.8.0,<3"]
test = ["pytest>=9.1.1,<10"]

[project.scripts]
portscan-detector = "detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
